<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="See the Munich Netball club calendar.">
  <title>Club Calendar | Munich Netball</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Netball Munich, home">
      <img class="wordmark-image" src="assets/club-logo-white.png" alt="">
      <span class="wordmark-text">
        <span class="wordmark-city">NETBALL</span>
        <span class="wordmark-sport">MUNICH</span>
      </span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="join-us.html">Join Us</a>
      <a href="index.html#faq">FAQ</a>
      <a href="club-calendar.html" aria-current="page">Club Calendar</a>
    </nav>
  </header>

  <main id="main-content" class="calendar-page page-width">
    <section aria-labelledby="calendar-title">
      <p class="eyebrow">Dates and events</p>
      <h1 id="calendar-title">Club Calendar</h1>
      <ul class="calendar-legend" aria-label="Calendar event legend">
        <li><span class="calendar-legend-swatch training" aria-hidden="true"></span>Training</li>
        <li><span class="calendar-legend-swatch tournaments" aria-hidden="true"></span>Tournaments</li>
        <li><span class="calendar-legend-swatch socials" aria-hidden="true"></span>Socials</li>
      </ul>
      <div class="calendar-embed">
        <iframe
          src="https://calendar.google.com/calendar/embed?src=netballmunich%40gmail.com&amp;ctz=Europe%2FBerlin"
          title="Munich Netball club calendar"
          loading="lazy"
          frameborder="0"
          scrolling="no"></iframe>
      </div>
    </section>
  </main>

  <footer class="site-footer page-width">
    <a class="wordmark footer-wordmark" href="index.html" aria-label="Netball Munich, home">
      <img class="wordmark-image" src="assets/club-logo-white.png" alt="">
      <span class="wordmark-text"><span class="wordmark-city">NETBALL</span><span class="wordmark-sport">MUNICH</span></span>
    </a>
    <a href="#main-content" class="back-to-top">Back to top ↑</a>
  </footer>
</body>
</html>
